<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abba AI Assistant</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column}header{padding:22px;border-bottom:1px solid #28334d;background:#11182b}h1{margin:0 0 6px;font-size:24px}p{margin:0;color:#aeb8d0}#chat{flex:1;padding:18px;overflow:auto}.msg{max-width:85%;padding:13px 15px;border-radius:16px;margin:10px 0;line-height:1.5;white-space:pre-wrap}.user{margin-left:auto;background:#2563eb}.bot{background:#1b2438}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px}.tools button,.send button{border:0;border-radius:12px;padding:10px 13px;background:#202b45;color:#fff}.send{display:flex;gap:10px;padding:15px 18px;background:#11182b}textarea{flex:1;resize:none;border:1px solid #303b58;border-radius:14px;background:#0c1324;color:#fff;padding:13px;font-size:15px;min-height:52px}.send button{background:#2563eb;padding:0 20px}.small{text-align:center;color:#8f9bb5;font-size:12px;padding:8px}</style></head><body><div class="app"><header><h1>🤖 Abba AI Assistant</h1><p>Research • Problem Solving • Tech • Social Media • Learning</p></header><div id="chat"></div><div class="tools"><button onclick="quick('Research this topic: ')">🔎 Research</button><button onclick="quick('Help me solve this problem: ')">🧠 Solve</button><button onclick="quick('Create a Hausa Facebook post about: ')">📱 Facebook</button><button onclick="quick('Create a TikTok/Reels script about: ')">🎬 Video</button><button onclick="quick('Teach me this from beginner to advanced: ')">📚 Learn</button></div><div class="send"><textarea id="input" placeholder="Ask Abba AI Assistant..."></textarea><button onclick="send()">Send</button></div><div class="small">Prototype v1 — AI and web-search connection comes next.</div></div><script>const chat=document.getElementById('chat'),input=document.getElementById('input');function add(t,w){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function quick(t){input.value=t;input.focus()}function send(){let q=input.value.trim();if(!q)return;add(q,'user');input.value='';setTimeout(()=>add('🤖 I received your request. This prototype interface is working. Next we will connect an AI model and web search so I can give real answers and research current information.','bot'),200)}input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});add('Assalamu alaikum Abba! 👋\nNi ne Abba AI Assistant. Ka tambaye ni game da research, problem solving, technology, learning, ko social media.','bot');</script></body></html>
